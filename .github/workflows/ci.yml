name: CI

on:
  push:
    branches:
      - main
      - github-actions-ci
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_password
        options: >-
          --health-cmd="pg_isready -U gym -d gym_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          DB_HOST: postgres
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_password
          JWT_SECRET: github-actions-test-secret
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gym_db
          SPRING_DATASOURCE_USERNAME: gym
          SPRING_DATASOURCE_PASSWORD: gym_password
        run: ./mvnw test