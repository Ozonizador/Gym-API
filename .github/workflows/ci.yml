name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gym -d gym_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          DB_HOST: localhost
          POSTGRES_DB: gym_db
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym_password
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw test

      - name: Build application
        run: ./mvnw package -DskipTests

      - name: Build Docker image
        run: docker build -t gym-api:latest .